# Site specific security headers. The base image already sends HSTS,
# X-Frame-Options, X-Content-Type-Options and Referrer-Policy. Keep add_header
# here at server level: an add_header inside a location block drops all
# inherited headers for that location.
#
# add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'self'" always;
# add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: db
      MYSQL_USER: db
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL} # Generated by Coolify
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQLROOT} # Generated by Coolify
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 1s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: ./.coolify/Dockerfile # PHP + Node versions are set in the Dockerfile
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - assets_data:/app/web/assets

  queue:
    build:
      context: .
      dockerfile: ./.coolify/Dockerfile
    command: ["php", "craft", "queue/listen", "--verbose"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f queue/listen > /dev/null || exit 1"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - assets_data:/app/web/assets
    restart: unless-stopped

  nuxt:
    build:
      context: .
      dockerfile: ./.coolify/Dockerfile
      target: nuxt
    depends_on:
      - web
    restart: unless-stopped

volumes:
  db_data: # Defines the 'db_data' volume for persistent database storage (database is not deleted during deploy)
  assets_data: # Defines the 'assets_data' volume for persistent asset storage (assets get not deleted during deploy)

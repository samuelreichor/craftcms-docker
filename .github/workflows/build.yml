name: Build images

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'examples/**'
  pull_request:
  # Weekly rebuild to pick up security updates from the upstream images.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: ${{ matrix.php }}-${{ matrix.target }} (${{ matrix.arch.name }})
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        target: [cli, web]
        arch:
          - { name: amd64, runner: ubuntu-24.04 }
          - { name: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch.name }}
          build-args: PHP_VERSION=${{ matrix.php }}
          pull: true
          # Scheduled builds skip the cache so apk packages are refreshed too.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=${{ matrix.php }}-${{ matrix.target }}-${{ matrix.arch.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.php }}-${{ matrix.target }}-${{ matrix.arch.name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ matrix.php }}-${{ matrix.target }}-${{ matrix.arch.name }}
          path: /tmp/digests/*
          retention-days: 1

  # Combines the per-arch images into one multi-arch tag.
  merge:
    name: ${{ matrix.php }}-${{ matrix.target }}
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        target: [cli, web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.php }}-${{ matrix.target }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest
        working-directory: /tmp/digests
        run: |
          date=$(date -u +%Y%m%d)
          docker buildx imagetools create \
            -t "$IMAGE:${{ matrix.php }}-${{ matrix.target }}" \
            -t "$IMAGE:${{ matrix.php }}-${{ matrix.target }}-$date" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ matrix.php }}-${{ matrix.target }}"

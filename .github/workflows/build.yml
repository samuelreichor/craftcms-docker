name: Build images

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'examples/**'
  pull_request:
  # Weekly rebuild to pick up security updates from the upstream images.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      php:
        description: 'PHP versions as JSON list, e.g. ["8.4"] (default: all from php-versions.json)'
        required: false
        type: string
      no-cache:
        description: Build without cache
        required: false
        type: boolean
        default: false
  # Called by scan.yml to rebuild versions with fixable vulnerabilities.
  workflow_call:
    inputs:
      php:
        required: false
        type: string
      no-cache:
        required: false
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The PHP versions to build come from php-versions.json, unless the caller
  # passes a subset.
  versions:
    runs-on: ubuntu-24.04
    outputs:
      php: ${{ steps.php.outputs.versions }}
    steps:
      - uses: actions/checkout@v7

      - id: php
        env:
          REQUESTED: ${{ inputs.php }}
        run: echo "versions=$(echo "${REQUESTED:-$(cat php-versions.json)}" | jq -c .)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.php }} (${{ matrix.arch.name }})
    needs: versions
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.versions.outputs.php) }}
        arch:
          - { name: amd64, runner: ubuntu-24.04 }
          - { name: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch.name }}
          build-args: PHP_VERSION=${{ matrix.php }}
          pull: true
          # Scheduled and security rebuilds skip the cache so apk packages are refreshed too.
          no-cache: ${{ github.event_name == 'schedule' || inputs.no-cache == true }}
          cache-from: type=gha,scope=${{ matrix.php }}-${{ matrix.arch.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.php }}-${{ matrix.arch.name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ matrix.php }}-${{ matrix.arch.name }}
          path: /tmp/digests/*
          retention-days: 1

  # Combines the per-arch images into one multi-arch tag.
  merge:
    name: ${{ matrix.php }}
    if: github.event_name != 'pull_request'
    needs: [versions, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.versions.outputs.php) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.php }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest
        working-directory: /tmp/digests
        run: |
          date=$(date -u +%Y%m%d)
          docker buildx imagetools create \
            -t "$IMAGE:${{ matrix.php }}" \
            -t "$IMAGE:${{ matrix.php }}-$date" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ matrix.php }}"

      # Reports known vulnerabilities (fixable, HIGH/CRITICAL) in the log and the
      # repository's Security tab. Doesn't fail the build, since most findings
      # come from upstream and are fixed by the next weekly rebuild.
      - name: Scan for vulnerabilities
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          for format in table sarif; do
            docker run --rm -v "$RUNNER_TEMP/trivy:/out" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              aquasec/trivy:latest image \
              --severity HIGH,CRITICAL --ignore-unfixed --format "$format" \
              --output "/out/report.$format" "$IMAGE:${{ matrix.php }}"
          done
          cat "$RUNNER_TEMP/trivy/report.table"

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/trivy/report.sarif
          category: trivy-php-${{ matrix.php }}
